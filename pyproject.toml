[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coronary-keyframe-poc"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8", "pydicom>=3", "scikit-image>=0.24", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2", "PyYAML>=6", "psutil>=5.9"]
[project.optional-dependencies]
test = ["pytest>=8"]
compressed = ["pylibjpeg", "pylibjpeg-libjpeg", "pylibjpeg-openjpeg", "pyjpegls"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keyframe = ["web/*.html", "web/*.css", "web/*.js"]
